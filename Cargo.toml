[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/altium-cli-extended"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/Hybirdss/altium-cli-extended"

[workspace.dependencies]
altium-core = { path = "crates/altium-core" }
altium-format = { path = "crates/altium-format" }
altium-doc = { path = "crates/altium-doc" }
altium-analysis = { path = "crates/altium-analysis" }
altium-designer = { path = "crates/altium-designer" }
cfb = "0.15.0"
chrono = "0.4.45"
clap = { version = "4", features = ["derive", "string", "env"] }
encoding_rs = "0.8.42"
flate2 = "1.1.10"
glob = "0.3.4"
indexmap = { version = "2.14.2", features = ["serde"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
