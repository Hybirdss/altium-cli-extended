name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
        rust: [stable]
        include:
          - os: ubuntu-22.04
            rust: 1.89.0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Cache sample projects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .fixtures/samples
          key: fixtures-v2-${{ runner.os }}-${{ hashFiles('scripts/fetch-fixtures.sh') }}
      - name: Fetch sample projects
        shell: bash
        run: scripts/fetch-fixtures.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Smoke test the binary
        shell: bash
        run: |
          cargo run --locked -q -p altium-cli-extended --bin ace -- doctor --json > doctor.json
          cargo run --locked -q -p altium-cli-extended --bin ace -- commands --brief --json > /dev/null
          cargo run --locked -q -p altium-cli-extended --bin ace -- bom .fixtures/samples/BeagleBoneCape/BeagleBoneCape.PrjPcb --json > /dev/null
